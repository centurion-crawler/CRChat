[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crchat"
version = "0.1.0"
description = "Inference and WSI feature extraction for CRChat-32b"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "CRChat contributors"}]
dependencies = [
  "accelerate>=0.21",
  "h5py>=3.8",
  "numpy>=1.23",
  "Pillow>=9.5",
  "safetensors>=0.4",
  "torch>=2.1",
  "transformers>=4.37,<4.58",
]

[project.optional-dependencies]
wsi = ["openslide-python>=1.3", "openslide-bin>=4.0.0.8"]
dev = ["pytest>=7.4"]

[project.scripts]
crchat = "crchat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crchat = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
